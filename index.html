<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirana List Builder - Prepare Your Grocery List</title>
    <meta name="description"
        content="Organize your grocery shopping with ease. Browse products, add to your list, and pre-prepare for your next visit to the shop.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="light-theme">

    <!-- Top App Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 12H5V20C5 21.1 5.9 22 7 22H17C18.1 22 19 21.1 19 20V12H22L12 2Z"
                        fill="currentColor" />
                </svg>
                <span>Kirana List</span>
            </a>
            
            <div class="header-actions">
                <button class="settings-toggle" id="settings-toggle" aria-label="Settings" style="background:none;border:none;color:var(--text-primary);cursor:pointer;padding:0.5rem;display:flex;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- App Content Wrapper -->
    <div class="app-shell">
        <header class="hero mini-hero" id="home">
            <div class="hero-content">
                <h1>Shopping Planner</h1>
                <p>Prepare your grocery list with visuals.</p>
            </div>
        </header>

        <main class="main-content">
            <!-- Search & Filter bar (Sticky) -->
            <div class="sticky-filter-bar">
                <div class="search-bar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search apple, milk, bread...">
                </div>
                
                <div class="category-scroller">
                    <ul id="category-list" class="category-chips">
                        <!-- Rendered by JS -->
                    </ul>
                </div>
            </div>

            <section class="products-section" id="shop">
                <div id="products-grid" class="products-grid">
                    <!-- Products will be rendered here -->
                    <div class="loader">Organizing catalog...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#home" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="#shop" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Items</span>
        </a>
        <button id="view-list-btn" class="nav-item list-btn">
            <div class="list-icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                <span id="list-count-badge" class="badge">0</span>
            </div>
            <span>My List</span>
        </button>
        <a href="about.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span>About</span>
        </a>
    </nav>

    <!-- Shopping List Drawer (Remains same functionality) -->
    <div id="list-drawer" class="list-drawer">
        <div class="drawer-header">
            <h3>Shopping List</h3>
            <button id="close-drawer" class="close-btn">&times;</button>
        </div>
        <div id="list-items" class="drawer-content">
            <p class="empty-msg">Your list is currently empty.</p>
        </div>
        <div class="drawer-footer">
            <button id="copy-list" class="btn btn-secondary">Copy Text</button>
            <button id="clear-list" class="btn btn-outline">Clear All</button>
        </div>
    </div>
    <div id="drawer-overlay" class="drawer-overlay"></div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="drawer-overlay" style="z-index: 1002; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
        <div class="modal-content" style="background: var(--surface-color); padding: 1.5rem; border-radius: var(--radius-lg); width: 90%; max-width: 400px; box-shadow: var(--shadow-lg); transition: transform 0.2s ease; transform: scale(0.95);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.2rem;">Settings</h3>
                <button id="close-settings" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-primary);">&times;</button>
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">System Language</label>
                <div id="google_translate_element" style="border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.2rem; display: block; overflow: hidden; background: var(--bg-color);"></div>
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">Measurement System</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: var(--bg-color);">
                        <input type="radio" name="unitSystem" value="metric" style="accent-color: var(--primary-color);"> 
                        <div>
                            <div style="font-weight: 600; font-size: 0.9rem;">Metric</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);">kg, g, L</div>
                        </div>
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: var(--bg-color);">
                        <input type="radio" name="unitSystem" value="imperial" style="accent-color: var(--primary-color);"> 
                        <div>
                            <div style="font-weight: 600; font-size: 0.9rem;">Imperial</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);">lbs, gal</div>
                        </div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom" >
            <p>&copy; 2026 Kirana List Builder. For preparation purposes only.</p>
        </div>
    </footer>

    <script src="assets/js/app.js"></script>
    
    <!-- Google Translate Script for Indian Languages Support -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'hi,te,ta,kn,ml,mr,bn,gu,pa,ur,en', // Hindi, Telugu, Tamil, Kannada, Malayalam, Marathi, Bengali, Gujarati, Punjabi, Urdu, English
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
